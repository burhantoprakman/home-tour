[project]
name = "home-tour-worker"
version = "0.1.0"
description = "Home Tour GPU pipeline: room video -> streamed SOG splat, collision mesh, meta.json"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.0",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    "open3d==0.19.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # numpy 2.x on macOS Accelerate raises spurious FP warnings from matmul (results are finite).
    "ignore:.*encountered in matmul:RuntimeWarning",
]
